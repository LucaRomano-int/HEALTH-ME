<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 500 - Versión HTTP No SoportadaError Interno del Servidor</title>
  <link rel="stylesheet" href="src/assets/css/error-styles.css">
</head>
<body>

  <main class="error-container">
    <!-- Columna Izquierda: Imagen sin recuadro -->
    <div class="error-image-box">
      <img src="public/logos/error500logo.png" alt="Error 500 - Error Interno del Servidor" class="error-img">
    </div>

    <!-- Columna Derecha: Texto y botón bien centrados -->

      <h1 class="error-code">500</h1>
      <h2 class="error-title">Error Interno del Servidor</h2>
