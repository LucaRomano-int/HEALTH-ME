<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 403 - Acceso Denegado</title>
  <link rel="stylesheet" href="src/assets/css/error-styles.css">
</head>
<body>

  <main class="error-container">
    <!-- Columna Izquierda: Imagen sin recuadro -->
    <div class="error-image-box">
      <img src="public/logos/error403logo.png" alt="Error 403 - Acceso Denegado" class="error-img">
    </div>

    <!-- Columna Derecha: Texto y botón bien centrados -->
    <div class="error-text-box">
      <h1 class="error-code">403</h1>
      <h2 class="error-title">Acceso Denegado</h2>
      <p class="error-description">Lo sentimos, no cuentas con los permisos necesarios para acceder a este recurso o sección protegida.</p>
      <a href="../../index.html" class="btn-error-home">Volver al inicio</a>
    </div>
  </main>

</body>
</html>
