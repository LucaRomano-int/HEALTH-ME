<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404 - Página No Encontrada</title>
  <link rel="stylesheet" href="src/assets/css/error-styles.css">
</head>
<body>

  <main class="error-container">
    <!-- Columna Izquierda: Imagen sin recuadro -->
    <div class="error-image-box">
      <img src="public/logos/error404logo.png" alt="Error 404 - Página No Encontrada" class="error-img">
    </div>

    <!-- Columna Derecha: Texto y botón bien centrados -->
    <div class="error-text-box">
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Página No Encontrada</h2>
      <p class="error-description">La página que estás buscando pudo haber sido eliminada, cambió de dirección o no se encuentra disponible temporalmente.</p>
      <a href="../../index.html" class="btn-error-home">Volver al inicio</a>
    </div>
  </main>

</body>
</html>
